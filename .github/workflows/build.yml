name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura
        env:
          RC_KEYSTORE_BASE64: ${{ secrets.RC_KEYSTORE_BASE64 }}
        run: |
          echo "$RC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RC_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          RC_KEYSTORE_PASSWORD: ${{ secrets.RC_KEYSTORE_PASSWORD }}
          RC_KEY_ALIAS: ${{ secrets.RC_KEY_ALIAS }}
          RC_KEY_PASSWORD: ${{ secrets.RC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=$((10000 + ${{ github.run_number }})) \
            -PversionName=1.0.${{ github.run_number }}

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk RainhaCarmesim.apk
          jq -n \
            --arg versionName "1.0.$BUILD_NUMBER" \
            --argjson versionCode $((10000 + BUILD_NUMBER)) \
            --arg releaseNotes "$COMMIT_MESSAGE" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/latest/RainhaCarmesim.apk" \
            --arg sha256 "$(sha256sum RainhaCarmesim.apk | cut -d' ' -f1)" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionName: $versionName, versionCode: $versionCode, releaseNotes: $releaseNotes, apkUrl: $apkUrl, sha256: $sha256, publishedAt: $publishedAt}' \
            > latest.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RainhaCarmesim.apk latest.json --latest \
            --title "Rainha Carmesim 1.0.$BUILD_NUMBER" --notes "$COMMIT_MESSAGE"
