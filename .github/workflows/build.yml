name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura (se configurada)
        env:
          RC_KEYSTORE_BASE64: ${{ secrets.RC_KEYSTORE_BASE64 }}
          RC_KEYSTORE_PASSWORD: ${{ secrets.RC_KEYSTORE_PASSWORD }}
          RC_KEY_ALIAS: ${{ secrets.RC_KEY_ALIAS }}
          RC_KEY_PASSWORD: ${{ secrets.RC_KEY_PASSWORD }}
        run: |
          if [ -n "$RC_KEYSTORE_BASE64" ]; then
            echo "$RC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            {
              echo "RC_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
              echo "RC_KEYSTORE_PASSWORD=$RC_KEYSTORE_PASSWORD"
              echo "RC_KEY_ALIAS=$RC_KEY_ALIAS"
              echo "RC_KEY_PASSWORD=$RC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Chave de release configurada."
          else
            echo "::warning::Secrets de assinatura ausentes (ex.: PR de fork). O APK deste build usa a chave de debug."
          fi

      - name: Testes unitários
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Compilar APK (release)
        run: ./gradlew --no-daemon assembleRelease -PversionName=0.0.${{ github.run_number }} -PversionCode=${{ github.run_number }}

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: RainhaCarmesim-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Relatórios (testes e lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
